name: atlas-gerbi-expanded

services:
  api:
    environment:
      API_CORS_ORIGIN: ${GERBI_EXPANDED_PUBLIC_ORIGIN:?GERBI_EXPANDED_PUBLIC_ORIGIN is required}
      IDENTITY_SECURE_COOKIES: 'false'
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      IDENTITY_AI_PROVIDER_PROCESSING_VERSION: ${IDENTITY_AI_PROVIDER_PROCESSING_VERSION:-test-v1}
      FOOD_STORAGE_ENABLED: 'true'
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: atlas-private
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      minio-init: { condition: service_completed_successfully }
    ports: !override []

  worker:
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      FOOD_VISION_PROVIDER: ${FOOD_VISION_PROVIDER:-fake}
      FOOD_FAKE_MODE: ${FOOD_FAKE_MODE:-success}
      GENAPI_NATIVE_BASE_URL: ${GENAPI_NATIVE_BASE_URL:-https://api.gen-api.ru/api/v1}
      GENAPI_VISION_MODEL: ${GENAPI_VISION_MODEL:-gpt-4o}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: atlas-private
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_FORCE_PATH_STYLE: 'true'
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-}
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
    depends_on:
      minio-init: { condition: service_completed_successfully }

  web:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    ports: !override []

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ['server','/data','--console-address',':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    healthcheck:
      test: ['CMD','mc','ready','local']
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    entrypoint: ['/bin/sh','-c']
    command: ['mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null && mc mb --ignore-existing local/atlas-private >/dev/null && mc anonymous set none local/atlas-private >/dev/null']

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ['CMD','wget','-qO-','http://127.0.0.1/login']
      interval: 5s
      timeout: 4s
      retries: 20
    ports:
      - '${GERBI_EXPANDED_PUBLIC_PORT:-3114}:80'
    volumes:
      - ./infrastructure/nginx.ui-001.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  minio-data:
