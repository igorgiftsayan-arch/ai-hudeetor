server {
  listen 80;
  server_name _;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:3001;
  set $web_upstream web:3000;
  set $food_storage_upstream minio:9000;

  # Private bucket: the object store validates the short-lived signed request.
  # Preserve the public host and original URI for AWS Signature V4 verification.
  location ^~ /atlas-private/ {
    limit_except GET PUT HEAD { deny all; }
    client_max_body_size 10m;
    access_log off;
    proxy_pass http://$food_storage_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_read_timeout 65s;
    add_header Cache-Control "private, no-store" always;
  }

  location /api/v1/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 65s;
  }

  location / {
    proxy_pass http://$web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Request-Id $request_id;
  }
}
