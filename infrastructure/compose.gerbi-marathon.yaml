name: atlas-gerbi-marathon

services:
  api:
    environment:
      API_CORS_ORIGIN: ${GERBI_MARATHON_PUBLIC_ORIGIN:?GERBI_MARATHON_PUBLIC_ORIGIN is required}
      IDENTITY_SECURE_COOKIES: 'false'
      MARATHON_BOOTSTRAP_ENABLED: ${MARATHON_BOOTSTRAP_ENABLED:-false}
      MARATHON_BOOTSTRAP_USER_IDS: ${MARATHON_BOOTSTRAP_USER_IDS:-}
      IDENTITY_AI_PROVIDER_PROCESSING_VERSION: ${IDENTITY_AI_PROVIDER_PROCESSING_VERSION:-test-v1}
      IDENTITY_AI_PROVIDER_DISCLOSURE: ${IDENTITY_AI_PROVIDER_DISCLOSURE:-AI is running in test mode.}
    ports: !override []

  web:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    ports: !override []

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/login']
      interval: 5s
      timeout: 4s
      retries: 20
    ports:
      - '${GERBI_MARATHON_PUBLIC_PORT:-3112}:80'
    volumes:
      - ./infrastructure/nginx.ui-001.conf:/etc/nginx/conf.d/default.conf:ro
