name: ${PRODUCTION_COMPOSE_PROJECT_NAME:-atlas-preproduction}

services:
  api:
    environment:
      APP_ENV: production
      API_CORS_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN is required}
      API_TRUST_PROXY_HOPS: 1
      IDENTITY_SECURE_COOKIES: 'true'
    ports: !override []

  worker:
    environment:
      APP_ENV: production

  web:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    ports: !override []

  migrate:
    environment:
      APP_ENV: production

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/api/v1/health/ready']
      interval: 5s
      timeout: 4s
      retries: 20
    ports:
      - '127.0.0.1:${PRODUCTION_GATEWAY_PORT:-3200}:80'
    volumes:
      - ./infrastructure/nginx.production-gateway.conf:/etc/nginx/conf.d/default.conf:ro
